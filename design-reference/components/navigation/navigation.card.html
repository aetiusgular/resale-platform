<!-- @dsCard group="Components" viewport="700x140" name="Navigation — TabBar" subtitle="Caps labels on a 1px rule · active = the view's accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../pv-loader.js?v=3"></script>
<style>
  body { margin: 0; padding: 32px 24px; }
  .fallback { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); padding: 24px; }
</style>
</head>
<body>
<div id="root"><div class="fallback">Component bundle not compiled yet.</div></div>
<script type="text/babel">
window.loadPV('../../', 'TabBar').then((NS) => {
  const { TabBar } = NS;
  const Demo = () => {
    const [cat, setCat] = React.useState('outerwear');
    return (
      <TabBar
        ariaLabel="Categories"
        activeId={cat}
        onChange={setCat}
        tabs={[
          { id: 'all', label: 'All', count: 412 },
          { id: 'outerwear', label: 'Outerwear', count: 128 },
          { id: 'denim', label: 'Denim', count: 96 },
          { id: 'footwear', label: 'Footwear', count: 74 },
          { id: 'archive', label: 'Archive', disabled: true },
        ]}
      />
    );
  };
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
}).catch((e) => console.warn(e));
</script>
</body>
</html>
