<!-- @dsCard group="Colors" viewport="700x150" name="Core palette" subtitle="bg · ink · ink-soft · line" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; display: flex; gap: 24px; }
  .sw { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .chip { height: 56px; border-radius: 2px; }
  .tok { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--ink); }
  .hex { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="sw">
    <div class="chip" style="background: var(--bg); border: 1px solid var(--line);"></div>
    <div><div class="tok">--bg</div><div class="hex">#FFFFFF · ALL BACKGROUNDS</div></div>
  </div>
  <div class="sw">
    <div class="chip" style="background: var(--ink);"></div>
    <div><div class="tok">--ink</div><div class="hex">#111111 · TEXT, BUTTONS</div></div>
  </div>
  <div class="sw">
    <div class="chip" style="background: var(--ink-soft);"></div>
    <div><div class="tok">--ink-soft</div><div class="hex">#6B6B6B · METADATA</div></div>
  </div>
  <div class="sw">
    <div class="chip" style="background: var(--line);"></div>
    <div><div class="tok">--line</div><div class="hex">#E5E5E5 · 1PX BORDERS</div></div>
  </div>
</body>
</html>
