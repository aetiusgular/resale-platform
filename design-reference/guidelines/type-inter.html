<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .h { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
  .row { display: flex; gap: 24px; align-items: baseline; }
  .t { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .caps { font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="h">Every piece has a record.</div>
  <div class="row">
    <span style="font-weight: 400;">Body 400</span>
    <span style="font-weight: 500;">Medium 500</span>
    <span style="font-weight: 600;">Semibold 600</span>
    <span style="font-weight: 700;">Bold 700</span>
    <span class="caps">Nav / section label</span>
  </div>
  <div class="t">Headers, nav, buttons · sentence case in chrome · caps only for nav + section labels at 11–12px, +0.08em</div>
</body>
</html>
