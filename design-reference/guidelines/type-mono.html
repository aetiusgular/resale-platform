<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; display: flex; gap: 48px; }

  .mono { font-family: var(--font-mono); font-size: 14px; }
  .b { font-weight: 700; }
  .soft { color: var(--ink-soft); font-size: 12px; }
  .t { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="col">
    <div class="t">A listing reads as a record</div>
    <div class="mono b">Raf Simons Consumed Bomber AW03</div>
    <div class="mono">$3,850</div>
    <div class="mono soft">EU 48 · 8/10</div>
  </div>
  <div class="col">
    <div class="t">So does everything around it</div>
    <div class="mono soft">@objectdealer</div>
    <div class="mono soft">3d ago</div>
    <div class="mono soft">No. 08841</div>
    <div class="mono soft">AUTHENTICATED 12 JUL 2026</div>
  </div>
</body>
</html>
