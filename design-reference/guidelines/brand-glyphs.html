<!-- @dsCard group="Brand" viewport="700x160" name="Glyphs, not icons" subtitle="No icon font, no SVG, no emoji — type does the work" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; display: flex; gap: 40px; align-items: center; }
  .g { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .glyph { font-size: 22px; line-height: 1; }
  .t { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
  .note { margin-left: auto; max-width: 220px; font-size: 12px; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="g"><span class="glyph">×</span><span class="t">Dismiss</span></div>
  <div class="g"><span class="glyph">▾ ▴</span><span class="t">Dropdown</span></div>
  <div class="g"><span class="glyph">→</span><span class="t">Follow-on</span></div>
  <div class="g"><span class="glyph">·</span><span class="t">Separator</span></div>
  <div class="g"><span class="glyph">—</span><span class="t">Registrar dash</span></div>
  <div class="note">If an affordance seems to need an icon, use text anyway.</div>
</body>
</html>
