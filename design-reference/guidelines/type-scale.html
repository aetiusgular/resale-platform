<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: baseline; gap: 20px; }
  .px { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink-soft); width: 72px; flex: none; }
  .s { font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="row"><span class="px">40 / 600</span><span class="s" style="font-size: 40px;">The archive</span></div>
  <div class="row"><span class="px">28 / 600</span><span class="s" style="font-size: 28px;">Recently authenticated</span></div>
  <div class="row"><span class="px">20 / 600</span><span class="s" style="font-size: 20px;">Offer history</span></div>
  <div class="row"><span class="px">16 / 500</span><span class="s" style="font-size: 16px; font-weight: 500;">Seller record</span></div>
  <div class="row"><span class="px">14 / 400</span><span style="font-size: 14px;">Body — 14px Inter 400, line-height 1.6.</span></div>
  <div class="row"><span class="px">12 / 400</span><span style="font-size: 12px; color: var(--ink-soft);">Captions and helper text.</span></div>

</html>
