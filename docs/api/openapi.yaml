    post:
      tags: [payments]
      summary: Lock the listing and create the PaymentIntent. Call when the buyer taps PAY, not on screen load.
      security: [{ bearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [listingId], properties: { listingId: { type: string, format: uuid }, offerId: { type: string, format: uuid }, shippingAddress: { type: object, properties: { city: { type: string }, state: { type: string }, zip: { type: string }, country: { type: string } } } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: banned }
        '409': { description: Listing not available / being purchased. }
        '422': { description: Own listing / seller cannot accept payments / offer state. }
        '429': { description: Rate limited (10/hour). }
        '502': { description: Payment provider error. }
  /api/stripe/balance:
    get:
      tags: [payments]
      summary: Payouts dashboard (escrow + Stripe balance/bank/payouts; `stripe` null when not connected).
      security: [{ bearer: [] }]
      responses: { '200': { description: OK }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/stripe/connect/link:
    post:
      tags: [payments]
      summary: Stripe Connect Express onboarding URL. Open in ASWebAuthenticationSession (callback scheme `archive`).
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: verification_required }
  /api/stripe/connect/return:
    get:
      tags: [payments]
      summary: Stripe return URL. `?client=ios` → 302 `archive://stripe/connect/return?onboarding=complete`.
      parameters: [{ name: client, in: query, schema: { type: string, enum: [ios] } }]
      responses: { '302': { description: Redirect. } }
  /api/stripe/connect/refresh:
    get:
      tags: [payments]
      summary: Stripe refresh URL. `?client=ios` → 302 `archive://stripe/connect/refresh` (request a new link).
      parameters: [{ name: client, in: query, schema: { type: string, enum: [ios] } }]
      responses: { '302': { description: Redirect. } }

  # ── identity ─────────────────────────────────────────────────────────────────
  /api/idv/status:
    get:
      tags: [identity]
      security: [{ bearer: [] }]
      parameters: [{ name: required, in: query, schema: { type: string, enum: [sell, payout] } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/idv/start:
    post:
      tags: [identity]
      summary: Stripe Identity hosted-flow URL (flag VERIFICATION_ENABLED). Open in ASWebAuthenticationSession.
      security: [{ bearer: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri }, session_id: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { description: unconfigured }
  /api/idv/return:
    get:
      tags: [identity]
      summary: Stripe Identity return URL. `?client=ios` → 302 `archive://idv/return?submitted=1`.
      parameters: [{ name: client, in: query, schema: { type: string, enum: [ios] } }, { name: submitted, in: query, schema: { type: string } }]
      responses: { '302': { description: Redirect. } }

  # ── content ──────────────────────────────────────────────────────────────────
  /api/content/{slug}:
    get:
      tags: [content]
      summary: terms · privacy (HTML), help (FAQ), fees (structured). Public, cacheable.
      parameters: [{ name: slug, in: path, required: true, schema: { type: string, enum: [terms, privacy, help, fees] } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ContentDoc' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/recs/events:
    post:
      tags: [browse]
      summary: Telemetry batch (impression/click/save/search; ≤100 events; always 202). Flag recs_telemetry.
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { deviceId: { type: string }, events: { type: array, items: { type: object } } } } } } }
      responses: { '202': { description: Accepted. } }
