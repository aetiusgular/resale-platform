# pnpm 11 build script approvals (written by pnpm approve-builds)
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@15.5.22'
  - '@next/swc-darwin-arm64@15.5.22'
  - '@next/swc-darwin-x64@15.5.22'
  - '@next/swc-linux-arm64-gnu@15.5.22'
  - '@next/swc-linux-arm64-musl@15.5.22'
  - '@next/swc-linux-x64-gnu@15.5.22'
  - '@next/swc-linux-x64-musl@15.5.22'
  - '@next/swc-win32-arm64-msvc@15.5.22'
  - '@next/swc-win32-x64-msvc@15.5.22'
  - next@15.5.22
# Security overrides — force patched transitive deps (pnpm 11 reads overrides here,
# NOT package.json's "pnpm" field). All within-major patches; non-breaking.
overrides:
  brace-expansion: 5.0.8
  postcss: ^8.5.18
  sharp: ^0.35.3
  fast-uri: ^3.1.4
